[package]
name = "treff"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "A small forum for closed groups, authenticated by your own OIDC provider"
readme = "README.md"
keywords = ["forum", "oidc", "self-hosted", "blog"]
categories = ["web-programming"]

[dependencies]
ammonia = "4.1.4"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
comrak = "0.54.0"
maud = { version = "0.27.0", features = ["axum"] }
openidconnect = "4.0.1"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
toml = "1.1.5"
tower-http = { version = "0.7.1", features = ["set-header"] }

[dev-dependencies]
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
temp-env = "0.3.6"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
