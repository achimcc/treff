# Formatting and lints — through the SAME toolchain as a local check.
#
# The first version of this pulled `dtolnay/rust-toolchain@stable`, and it went
# red on the first push: that rustfmt is a different version from the one in
# the dev shell, and the two disagree about where to break a line. A CI job
# that checks with different tools than the developer does not check the same
# thing. So this goes through the flake as well.
name: fmt

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop --command cargo fmt --check
      - run: nix develop --command cargo clippy --all-targets -- -D warnings
